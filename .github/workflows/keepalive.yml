# Keeps the free Render instance awake. A sleeping free instance did not reliably wake when a
# visitor arrived (the request hung for 17+ minutes; only a redeploy brought it back). Render
# sleeps after 15 minutes without traffic; GitHub's scheduled jobs can run late, so ping every
# 5 minutes. One always-on service uses 744 of the 750 free instance hours a month.
name: keepalive
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 \
            https://trafficsim-ux3u.onrender.com/api/health
