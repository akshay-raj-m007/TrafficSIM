# Render Blueprint — free web service built from the repo's Dockerfile.
# Free tier: 0.1 CPU, 512 MB RAM, sleeps after 15 min without traffic (~1 min wake-up),
# 5 GB/month outbound bandwidth. Keep MAX_SESSIONS low until the load test says otherwise.
services:
  - type: web
    name: trafficsim
    runtime: docker
    plan: free
    region: singapore  # closest Render region to India
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Load test (README, "Deployment"): 0.1 CPU serves 2 live sessions at 1x without late frames;
      # a third makes all three late, and one session at 10x already runs at about 2 frames/s.
      - key: MAX_SESSIONS
        value: "2"
      # A dead connection (browser gone without closing) frees its slot after 30 s without a ping;
      # an open but unused session (no mouse/keys, only pings) is paused and closed after 10 min.
      - key: SESSION_HEARTBEAT_TIMEOUT_S
        value: "30"
      - key: SESSION_IDLE_TIMEOUT_S
        value: "600"
      # Custom comparisons on the hosted server: 3 runs, 300 s, one job at a time, one worker.
      # The five built-in experiments are precomputed and shipped (instant, no CPU).
      - key: COMPARE_MAX_RUNS
        value: "3"
      - key: COMPARE_MAX_DURATION_S
        value: "300"
      - key: COMPARE_MAX_JOBS
        value: "1"
      - key: COMPARE_WORKERS
        value: "1"
